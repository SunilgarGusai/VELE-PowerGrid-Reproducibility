name: Create frozen final AUT peer-review reproducibility release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify-and-publish:
    if: contains(github.event.head_commit.message, '[publish-final-review]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate exact repository inventory and scientific labels before publication
        run: python scripts/audit_final_reproducibility.py
      - name: Install minimal pinned PGLib replay dependencies and scientific renderer
        run: |
          python -m pip install -r certified_cut_v2/requirements.txt
          python -m pip install "matplotlib>=3.9,<4"
      - name: Freshly download all four pinned PGLib sources and validate their SHA-256
        run: python certified_cut_v2/fetch_pglib_v23_07_sources.py
      - name: Replay all 536 source-certified cut bounds and independent 13-case witnesses
        run: |
          python certified_cut_v2/build_source_cut_bounds.py
          python certified_cut_v2/replay_cut_certificates_offline.py
          python certified_cut_v2/independent_explicit_cut_witnesses.py
      - name: Validate all four data-asserting final scientific figure sources
        run: python scripts/generate_v2_scientific_figures.py
      - name: Restore committed SVG artwork after regeneration before immutable archive creation
        run: |
          git restore -- docs/assets/v2-figures/
          python scripts/audit_final_reproducibility.py
      - name: Produce version-specific public-only final snapshot and SHA-256 inventory
        run: python scripts/build_v2_public_release.py --tag v2.1.0-review-freeze
      - name: Publish final tagged peer-review freeze without modifying older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.1.0-review-freeze \
            --target "$GITHUB_SHA" \
            --title "v2.1.0-review-freeze — Final AUT code, data and scientific visual evidence" \
            --notes-file docs/RELEASE_NOTES_v2.1.0-review-freeze.md \
            dist/VELE_REPRODUCIBILITY_PUBLIC_v2.1.0-review-freeze.zip \
            dist/SHA256SUMS_PUBLIC_V2_FINAL.txt \
            dist/PUBLIC_V2_FINAL_FILE_HASHES.json
