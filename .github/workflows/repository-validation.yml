name: Repository verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required reviewer-facing files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f QUICKSTART.md
          test -f CITATION.cff
          test -f LICENSE
          test -f THIRD_PARTY_LICENSES.md
          test -f requirements.txt
          test -f docs/DATA_SOURCE_MANIFEST.md
          test -f docs/PHASE11_BRANCH_OUTAGE_REPORT.md
          test -f validation/python_dcpf_reference.py
          test -f validation/compare_matpower_python.py
          test -f validation/run_matpower_crosscheck.m
          test -f validation/README.md
          test -f validation/results/MATPOWER_OCTAVE_VALIDATION_REPORT.md
          test -f validation/results/matpower_octave_crosscheck_summary.csv
          test -f stages/01_matpower_preparation/scripts/prepare_phase2.py
          test -f stages/07_branch_outage_validation/outputs/branch_n1_network_summary.csv
          test -f stages/07_branch_outage_validation/outputs/branch_n1_redispatch_sensitivity_summary.csv
          test -f stages/07_branch_outage_validation/outputs/branch_n1_vele_correlations.csv
          test -f stages/07_branch_outage_validation/outputs/branch_n1_vele_event_auc.csv

      - name: Python syntax check
        run: |
          python -m py_compile validation/python_dcpf_reference.py
          python -m py_compile validation/compare_matpower_python.py
          python -m py_compile stages/01_matpower_preparation/scripts/prepare_phase2.py

      - name: CLI smoke tests
        run: |
          python validation/python_dcpf_reference.py --help
          python validation/compare_matpower_python.py --help

      - name: Verify committed numerical evidence
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          root = Path('.')
          mp = root / 'validation/results/matpower_octave_crosscheck_summary.csv'
          with mp.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          expected = {
              'case14': (14, 20),
              'case30': (30, 41),
              'case39': (39, 46),
              'case57': (57, 80),
              'case118': (118, 186),
              'case300': (300, 411),
          }
          assert len(rows) == 6, f'Expected 6 MATPOWER cases, found {len(rows)}'
          for row in rows:
              case = row['case']
              assert case in expected, f'Unexpected case {case}'
              assert (int(row['buses']), int(row['branches'])) == expected[case]
              assert float(row['max_abs_angle_error_deg']) <= 1e-8
              assert float(row['max_abs_pf_error_MW']) <= 1e-8
              assert float(row['max_abs_pt_error_MW']) <= 1e-8

          branch = root / 'stages/07_branch_outage_validation/outputs/branch_n1_network_summary.csv'
          with branch.open(newline='', encoding='utf-8') as f:
              br = list(csv.DictReader(f))
          assert len(br) == 6, f'Expected 6 branch-outage network rows, found {len(br)}'
          assert sum(int(r['branches']) for r in br) == 784
          assert sum(int(r['parallel_rows']) for r in br) == 22
          assert sum(int(r['topology_unchanged_outages']) for r in br) == 22
          assert sum(int(r['disconnection_cases']) for r in br) == 114
          assert sum(int(r['secondary_shedding_cases']) for r in br) == 47

          report = (root / 'validation/results/MATPOWER_OCTAVE_VALIDATION_REPORT.md').read_text(encoding='utf-8')
          assert '**Status:** PASS' in report
          print('PASS: committed MATPOWER and branch-outage evidence invariants')
          PY

      - name: Summary
        run: |
          echo '## Repository verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Pinned Python environment installs: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Required reviewer-facing files: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Python validation scripts compile: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- CLI smoke tests: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Committed MATPOWER cross-check evidence: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Frozen branch-outage summary invariants: PASS' >> "$GITHUB_STEP_SUMMARY"
